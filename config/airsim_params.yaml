interceptor_node_quaternion:
  ros__parameters:
    use_simulation: false
    
    # Physics parameters
    physics:
      g: 9.80665
      drag_coeff: 0.1625  # Linear drag coefficient
    
    # Control limits  
    limits:
      att_warning_deg: 45.0       # pi/4 rad (45 degrees)
    
    # MPC parameters
    mpc:
      ctrl_rate: 50
      tf: 0.8
      v_desired: 10.0
      tracking_distance: 0.0   # Desired tracking distance, interception only if 0.0

    # Proportional Navigation (PN) Terminal Guidance
    pn:
      enabled: true
      nav_constant: 5.0      # Navigation constant (N)
      switch_dist: 10.0      # Distance to switch to PN (meters)
      fov_switch_deg: 3.0    # Switch only if target within this FOV (degrees)
      max_accel_xy: 25.0     # Max horizontal acceleration (m/s^2)
      max_accel_z: 15.0      # Max vertical acceleration (m/s^2)
      drag_ff_coeff: 0.5     # PN drag feedforward coefficient (1/s), matches actual flight drag
    
    # Simulation parameters
    sim:
      interception_dist: 0.8
      initial_conditions:
        # target_vel: [-5.0, 2.0, 1.0]
        target_pos: [0.0, 8.0, 42.0]
        target_vel: [0.0, 0.0, 0.0]
    
    # Perception parameters
    perception:
      bbox_pos_std_dev: 3.0
      bbox_size_std_dev: 3.0
      target_physical_size_est: 1.0
    
    # Control execution delay compensation
    control:
      execution_delay: 0.01  # 0.01 seconds (10ms) delay compensation for real flight
      rate_tc: 0.02           # First-order response time constant for body rates
      # ctrl_scale: 0.63         # Scale factor for ctrl_coeff = scale * (1-exp(-dt/rate_tc))
      max_history_time_factor: 2.0  # History buffer size as multiple of execution_delay
      rate_control_enabled: true  # Enable rate control compensation
    
    # Camera parameters
    camera:
      width_px: 960
      height_px: 960

      # For FOV based calculation
      fov_deg: 30.0

      # For focal length based calculation
      # native_width_px: 1920
      # focal_length_mm: 12.0
      # pixel_size_um: 3.45

    gimbal:
      rp_coeff : 12.0
      y_coeff : 10.0
    
    # Cost function weights
    cost:
      w_los: 100.0              # Line-of-sight error weight
      w_align: 10.0             # Velocity alignment weight
      w_closing_speed: 0.1     # Closing speed error weight
      w_rates: 0.001            # Body rate control effort weight
      w_tilt: 0.0001            # Tilt angle error weight
      w_u_alpha: 0.1            # Body rate change weight
      w_u_thrust: 0.0001        # Thrust control effort weight
      w_zem: 1.0               # Zero Effort Miss weight (path correction via pitch/roll)

# W_LOS = 10.0               # 视线误差权重
# W_ALIGN = 1.0             # 速度对齐权重
# W_CLOSING_SPEED = 0.01    # 接近速度权重
# W_RATES = 0.0001          # 角速度控制量权重
# W_TILT = 0.0001          # 倾斜角误差权重
# W_U_ALPHA = 0.0001       # 角速度变化率权重
# W_U_THRUST = 0.000001    # 油门控制量权重